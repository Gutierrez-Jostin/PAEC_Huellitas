<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/user_style.css">
</head>
<body>

    <header class="head">

        <div class="logo-bar">
            <img src="../files/icons/logo.png" alt="logo" class="logotype">
            <h2 class="title-logo">
                HEALING LITTLE PETS
            </h2>
        </div>
        
    </header>

    <main> 
        <section>
            <article>

                <div class="margin">
                    <a href="../index.html" class="button-transparent">Back to the menu</a>
                </div>

                <div class="in-center">
                    
                    <img src="../files/icons/user-icon.png" alt="user-icon" class="icon">
                    <h1 class="login-title">Sign in to Healing Little Pets</h1>

                    <div class="held-user">
                        <table>
                            <tr>
                                <th>
                                    <input id="username" placeholder="User or Mail" class="button-size"/>
                                </th>
                            </tr>
                            <tr>
                                <th>
                                    <input id="password_login" placeholder="Password" class="button-size"/>
                                </th>
                            </tr>
                        </table>
                    </div>

                    <button id="login-enter" class="button-enter-size">Log In</button>

                    <p class="info">Don't have an account? <a href="Register.html" class="link-register">Sign Up.</a></p>
                </div>
                

            </article>
        </section>

    </main>

    <hr>

    <footer>
        <p>Rights Reserved of © Los Quinesteticos</p>
        <p>2026 Edition.</p>
    </footer>

</body>
</html>
