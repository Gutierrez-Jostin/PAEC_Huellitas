<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEALING LITTLE PETS</title>
<link rel="stylesheet" href="../CSS/register_style.css">

</head>
<body>
    <div class="register-container">
        <h2>CREAR TU CUENTA</h2>

        <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="nombre completo" required>
        </div>



    <div class="form-group">
         <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Correo electrico" required>
    
    </div>

     <div class="form-group">
         <label for="password">Choose a Password</label>
        <input type="password" id="password" name="password" placeholder="Contraseña" required>
    </div>

    <div class="form-group">
         <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmar contraseña" required>
    </div>
    <button type="submit" class="btn-register">REGISTRARME</button>
    <div class="login-link">
        ¿Tienes cuenta? <a href="Login.html">Iniciar sesion</a>
        </div>

</body>
</html>
