<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEALING LITTLE PETS</title>
<link rel="stylesheet" href="../CSS/register_style.css">

</head>
<body>
    <div class="margin">
                    <a href="../index.html" class="button-transparent">Back to the menu</a>
                </div>
   <div class="main-content">
        <div class="register-container">
        <h2>Make you account</h2>

        <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Name" required>
        </div>



    <div class="form-group">
         <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Email" required>
    
    </div>

     <div class="form-group">
         <label for="password">Choose a Password</label>
        <input type="password" id="password_register" name="password" placeholder="Password" required>
    </div>

    <div class="form-group">
         <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
    </div>
    <button type="submit" class="btn-register">Sign Up</button>
    <div class="login-link">
        Do you already have an account? <a href="Login.html">Log In</a>
        </div>
    </div>
   </div>

    <footer>
        
        <p>Rights Reserved of © Los Quinesteticos</p>
        <p>2026 Edition.</p>
    </footer>

    <script>
        document.querySelector('.btn-register').addEventListener('click', async (e) => {
            e.preventDefault(); 

            const nombre = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password_register').value;
            const confirm = document.getElementById('confirm_password').value;
            
            if (password !== confirm) {
                alert("Las contraseñas no coinciden");
                return;
            }
            
            try {
                const respuesta = await fetch('/api/register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });
                const resultado = await respuesta.json();
                alert(resultado.mensaje);
                
                if (respuesta.ok) {
                    window.location.href = 'Login.html';
                }
            } catch (error) {
                alert("Error de conexión: " + error.message);
            }
        });
    </script>

</body>
</html>
