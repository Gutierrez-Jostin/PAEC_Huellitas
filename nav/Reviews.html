<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuidado Animal - Información</title>
   
    <link rel="stylesheet" href="../CSS/reviews_style.css">
</head>
<body>

    <header class="head">
 
        <div class="logo-bar">
            <img src="../files/icons/logo.png" alt="logo" class="logotype">
            <h2 class="title-logo">
                HEALING LITTLE PETS
            </h2>
        </div>

        <div class="content-right">
            
            <div class="user-bar">
                <a href="Login.html" class="register-buttons">Log In</a>
                <a href="Register.html" class="register-buttons">Sign Up</a>
            </div>

            <nav class="nav-bar">
                <a href="../index.html" class="button-off">Info</a>
                <a href="Adoptions.html" class="button-off">Adoptions</a>
                <a href="AnimalCare.html" class="button-off">Animal Care</a>
                <a href="VeterinaryCare.html" class="button-off">Veterinary Care</a>
                <a href="Reviews.html" class="button-on">Feedback</a>
                <a href="Contact.html" class="button-off">Contacts</a>
            </nav>
        </div>
        
    </header>

        <main> 
            <section class="seccion-resenas">
                <h1>Our reviews</h1>
                <form id="form-resena" class="formulario-resena">
                    <input type="text" id="input-usuario" placeholder="Your username (e.g. @JohnDoe)" required>
                    <select id="select-estrellas" required>
                        <option value="5">5 Stars - Excellent</option>
                        <option value="4">4 Stars - Very Good</option>
                        <option value="3">3 Stars - Good</option>
                        <option value="2">2 Stars - Fair</option>
                        <option value="1">1 Star - Poor</option>
                    </select>
                    <textarea id="input-comentario" placeholder="Write your review here..." required></textarea>
                    <button type="submit">Submit Review</button>
                </form>
                <div class="fila">

                    <div class="articulos" id="contenedor-resenas">

                    </div>
                    <aside class="foto-aside">
                        <img src="../files/icons/perro-removebg-preview.png" alt="Perrito">
                    </aside>
                </div>
            </section>
        </main>

    <hr>

    <footer>
        <p>Rights Reserved of © Los Quinesteticos</p>
        <p>2026 Edition.</p>
    </footer>
    <script src="../JS/reviews.js"></script>
</body>
</html>
